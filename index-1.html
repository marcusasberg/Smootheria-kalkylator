    h += '<span style="color:#0f231f">'+(ing.namn||'–')+'</span>';
    h += '<span style="font-weight:700;color:#0d352e">'+fmtKrOre(ing.kr)+'  <span style="color:#a19d93;font-weight:400">('+pct+'%)</span></span>';
    h += '</div>';
    h += '<div style="background:#f2ebe2;border-radius:3px;height:6px"><div style="width:'+pct+'%;height:100%;background:#0d352e;border-radius:3px;opacity:0.7"></div></div>';
    h += '</div>';
  });
  h += '</div>';

  // Price comparison table
  h += '<div style="font-size:12px;font-weight:700;color:#6b6a62;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px">Marginal vid olika utpriser till kund</div>';
  h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:300px">';
  h += '<thead><tr>';
  h += '<th style="text-align:left;padding:7px 10px;background:#0d352e;color:white;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;border-radius:6px 0 0 0">Utpris/kopp</th>';
  h += '<th style="padding:7px 10px;background:#0d352e;color:white;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;text-align:right">Marginal kr</th>';
  h += '<th style="padding:7px 10px;background:#0d352e;color:white;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;text-align:right">Marginal %</th>';
  h += '<th style="padding:7px 10px;background:#0d352e;color:white;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;text-align:right;border-radius:0 6px 0 0">Mån (15 kp/d)</th>';
  h += '</tr></thead><tbody>';
  prices.forEach(p => {
    const marg = p - kostnadPerKopp;
    const margPct = p > 0 ? Math.round(marg/p*100) : 0;
    const manRes = marg * 15 * 30;
    const pos = marg > 0;
    const isCurrent = Math.abs(p - S.pris) < 0.5;
    const rowStyle = isCurrent ? 'background:#f9e3dd;' : '';
    h += '<tr style="border-bottom:1px solid #f2ebe2;'+rowStyle+'">';
    h += '<td style="padding:8px 10px;font-weight:'+(isCurrent?'700':'500')+'">'+p+' kr'+(isCurrent?' ← nuvarande':'')+' </td>';
    h += '<td style="padding:8px 10px;text-align:right;font-weight:700;color:'+(pos?'#0d352e':'#d92b2f')+'">'+(pos?'+':'')+fmtKrOre(marg)+'</td>';
    h += '<td style="padding:8px 10px;text-align:right;color:'+(pos?'#0d352e':'#d92b2f')+';font-weight:600">'+margPct+'%</td>';
    h += '<td style="padding:8px 10px;text-align:right;font-weight:700;color:'+(pos?'#0d352e':'#d92b2f')+'">'+(pos?'+':'')+fmtKr(manRes)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '</div>';

  el.innerHTML = h;
}

function kpiHtml(lbl, val, sub, hl) {
  const bg = hl ? '#0d352e' : 'white';
  const bc = hl ? '#0d352e' : '#ecdcd3';
  const tc = hl ? 'rgba(255,255,255,0.75)' : '#6b6a62';
  const vc = hl ? 'white' : '#0f231f';
  const sc = hl ? 'rgba(255,255,255,0.7)' : '#a19d93';
  return '<div style="flex:1;min-width:120px;background:'+bg+';border:1px solid '+bc+';border-radius:12px;padding:14px 16px">'
    + '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;color:'+tc+'">'+lbl+'</div>'
    + '<div style="font-size:20px;font-weight:800;color:'+vc+'">'+val+'</div>'
    + '<div style="font-size:11px;color:'+sc+';margin-top:4px">'+sub+'</div>'
    + '</div>';
}

// ── kundmarginal ──────────────────────────────────────────────────────────────

function kmUpdate(field, val) {
  KM[field] = parseFloat(String(val).replace(',', '.')) || 0;
  renderKundmarginalResults();
}

function renderKundmarginal() {
  const el = document.getElementById('km-content');
  if (!el) return;
  let h = '<div class="card">';
  h += '<h2 style="margin-bottom:4px">Kundmarginal</h2>';
  h += '<p class="sub">Räkna på vad kunden tjänar – används för att sälja in konceptet.</p>';
  h += '<div class="km-input-grid">';

  // Inpris (syncat från affärsmodell)
  h += '<div class="km-field">';
  h += '<label>Ert pris till kunden (kr/kopp) <span style="font-size:10px;color:#0d352e;font-weight:600">↔ synkas med affärsmodell</span></label>';
  h += '<input type="text" inputmode="decimal" id="km-smoInpris" value="'+KM.smoInpris+'" step="1" min="0" onchange="kmUpdate(\'smoInpris\',this.value)" onfocus="this.select()" onblur="kmUpdate(\'smoInpris\',this.value)">';
  h += '</div>';

  // Butikens utpris
  h += '<div class="km-field">';
  h += '<label>Kundens utpris till konsument inkl. moms (kr/kopp)</label>';
  h += '<input type="text" inputmode="decimal" id="km-butikPris" value="'+KM.butikPris+'" step="1" min="0" onchange="kmUpdate(\'butikPris\',this.value)" onfocus="this.select()" onblur="kmUpdate(\'butikPris\',this.value)">';
  h += '</div>';

  // Koppar per dag
  h += '<div class="km-field">';
  h += '<label>Koppar per dag (snitt)</label>';
  h += '<input type="text" inputmode="decimal" id="km-kopparPerDag" value="'+KM.kopparPerDag+'" step="1" min="0" onchange="kmUpdate(\'kopparPerDag\',this.value)" onfocus="this.select()" onblur="kmUpdate(\'kopparPerDag\',this.value)">';
  h += '</div>';

  // Antal dagar (justerbart)
  h += '<div class="km-field">';
  h += '<label>Antal dagar att räkna på</label>';
  h += '<input type="text" inputmode="decimal" id="km-dagar" value="'+KM.dagar+'" step="1" min="1" onchange="kmUpdate(\'dagar\',this.value)" onfocus="this.select()" onblur="kmUpdate(\'dagar\',this.value)">';
  h += '</div>';

  h += '</div>';

  // Moms toggle
  h += '<div style="display:flex;align-items:center;gap:10px;background:#faf5ee;border-radius:10px;padding:10px 14px;margin-top:4px">';
  h += '<input type="checkbox" id="km-moms-check" '+(KM.inkluderaMoms?'checked':'')+' onchange="KM.inkluderaMoms=this.checked;renderKundmarginalResults()" style="width:16px;height:16px;accent-color:#0d352e;cursor:pointer">';
  h += '<label for="km-moms-check" style="font-size:13px;font-weight:600;color:#0f231f;cursor:pointer;flex:1">Räkna bort moms från kundpriset</label>';
  h += '<select onchange="KM.momsSats=+this.value;renderKundmarginalResults()" style="font-size:13px;padding:4px 8px;border:1px solid #ecdcd3;border-radius:6px;font-family:inherit;color:#0f231f">';
  h += '<option value="6" '+(KM.momsSats===6?'selected':'')+'>6% (livsmedel fr.o.m. 2026)</option>';
  h += '<option value="12" '+(KM.momsSats===12?'selected':'')+'>12%</option>';
  h += '<option value="25" '+(KM.momsSats===25?'selected':'')+'>25%</option>';
  h += '</select>';
  h += '</div>';

  h += '</div>';

  // Butikens namn för erbjudandeblad
  h += '<div style="margin-top:14px;display:flex;gap:8px;align-items:center">';
  h += '<input id="km-kund-namn" type="text" placeholder="Kundens namn (för erbjudandeblad)..." value="' + (KM.kundNamn||'') + '" oninput="KM.kundNamn=this.value" style="flex:1;padding:9px 12px;border:1px solid #ecdcd3;border-radius:8px;font-size:13px;font-family:inherit;outline:none">';
  h += '</div>';
  h += '<button class="offer-btn" onclick="exportErbjudande()">📄 Generera erbjudandeblad (PDF)</button>';

  h += '<div id="km-results"></div>';
  el.innerHTML = h;
  renderKundmarginalResults();
}

function renderKundmarginalResults() {
  const el = document.getElementById('km-results');
  if (!el) return;

  const momsMulti = KM.inkluderaMoms ? (1 + KM.momsSats/100) : 1;
  const butikExkl = KM.butikPris / momsMulti;
  const momsKr = KM.butikPris - butikExkl;

  // Affärsmodell-kostnad för butiken per kopp
  const modell = S.modell;
  const leasKrPerKopp = modell === 'leasing' && KM.kopparPerDag > 0
    ? S.leasingPerMan / 30 / KM.kopparPerDag
    : 0;
  // Guard: avoid div/0 in margPct calculations
  // Påslag per kopp: butiken betalar smoInpris + påslag (det är deras totala inköpspris)
  // Vi visar det som ett samlat inköpspris - inte uppdelat
  const paslagKr = modell === 'paslag' ? S.koppprispaslag : 0;
  const effektivtInkop = KM.smoInpris + paslagKr;

  // Total inköpskostnad per kopp för kunden
  const totalInkopPerKopp = effektivtInkop + leasKrPerKopp;

  const margKr = butikExkl - totalInkopPerKopp;
  const margPct = butikExkl > 0 ? (margKr / butikExkl * 100) : 0;
  const margPctInkl = KM.butikPris > 0 ? (margKr / KM.butikPris * 100) : 0;
  const perDag = KM.kopparPerDag > 0 ? margKr * KM.kopparPerDag : 0;
  const perPeriod = perDag * KM.dagar;
  const pos = margKr > 0;
  const col = pos ? '#0d352e' : '#d92b2f';

  const modellText = modell === 'leasing'
    ? 'Kunden leasar maskinen (' + fmtKr(S.leasingPerMan) + '/mån)'
    : modell === 'paslag'
    ? 'Påslag ' + S.koppprispaslag + ' kr/kopp ingår i inköpspriset'
    : 'Vi äger & lånar ut maskinen (ingen extra kostnad för kunden)';

  let h = '<div class="card" style="margin-top:16px">';

  // Affärsmodell indicator
  h += '<div style="background:#faf5ee;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:8px">';
  h += '<span style="font-size:16px">' + (modell==='leasing'?'📋':modell==='paslag'?'💰':'🤝') + '</span>';
  h += '<div><div style="font-weight:700;color:#0f231f;margin-bottom:1px">Affärsmodell: ' + (modell==='leasing'?'Kunden leasar':modell==='paslag'?'Påslag per kopp':'Vi äger & lånar ut') + '</div>';
  h += '<div style="color:#6b6a62">' + modellText + '</div></div>';
  h += '</div>';

  // KPI strip
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">';
  h += kpiHtml('Inpris (inkl. alla avgifter)', fmtKrOre(totalInkopPerKopp), 'exkl. moms');
  if (modell === 'leasing') h += kpiHtml('Leasingkostnad/kopp', fmtKrOre(leasKrPerKopp), S.leasingPerMan+' kr/mån ÷ '+KM.kopparPerDag+' kp/dag ÷ 30d');
  h += kpiHtml('Marginal kr/kopp', (pos?'+':'')+fmtKrOre(margKr), 'exkl. moms', pos);
  h += kpiHtml('Marginal %', margPctInkl.toFixed(1)+'%', 'inkl. moms', pos);
  h += '</div>';

  // Detail table
  h += '<table class="km-result-table">';
  h += '<tr class="section"><td colspan="2">PER KOPP</td></tr>';
  h += '<tr><td>Kundens utpris inkl. moms</td><td>'+fmtKr(KM.butikPris)+'</td></tr>';
  if (KM.inkluderaMoms) {
    h += '<tr><td>Varav moms ('+KM.momsSats+'%)</td><td style="color:#6b6a62">–'+fmtKrOre(momsKr)+'</td></tr>';
    h += '<tr><td>Utpris exkl. moms</td><td>'+fmtKrOre(butikExkl)+'</td></tr>';
  }
  h += '<tr class="section"><td colspan="2">KUNDENS KOSTNADER PER KOPP</td></tr>';
  h += '<tr><td>Inpris produkt (från er)</td><td style="color:#d92b2f">–'+fmtKrOre(KM.smoInpris)+'</td></tr>';
  if (modell === 'paslag' && paslagKr > 0) {
    h += '<tr><td>Maskinavgift per kopp</td><td style="color:#d92b2f">–'+fmtKrOre(paslagKr)+'</td></tr>';
    h += '<tr><td>Totalt inköpspris per kopp</td><td style="font-weight:700">'+fmtKrOre(totalInkopPerKopp)+'</td></tr>';
  }
  if (modell === 'leasing') {
    h += '<tr><td>Leasingkostnad per kopp</td><td style="color:#d92b2f">–'+fmtKrOre(leasKrPerKopp)+'</td></tr>';
    h += '<tr><td style="font-size:11px;color:#a19d93">= '+fmtKr(S.leasingPerMan)+'/mån ÷ '+KM.kopparPerDag+' koppar/dag ÷ 30 dagar</td><td></td></tr>';
  }

  h += '<tr class="highlight"><td>Marginal per kopp inkl. moms</td><td style="color:'+col+'">'+(pos?'+':'')+fmtKrOre(margKr)+'</td></tr>';
  h += '<tr class="highlight"><td>Marginal % inkl. moms</td><td style="color:'+col+'">'+margPctInkl.toFixed(1)+'%</td></tr>';

  h += '<tr class="section"><td colspan="2">PERIODVIS ('+KM.kopparPerDag+' koppar/dag)</td></tr>';
  h += '<tr><td>Per dag</td><td style="color:'+col+';font-weight:700">'+(pos?'+':'')+fmtKr(perDag)+'</td></tr>';
  h += '<tr><td>Per vecka (7 dagar)</td><td style="color:'+col+';font-weight:700">'+(pos?'+':'')+fmtKr(perDag*7)+'</td></tr>';
  h += '<tr><td>Per månad (30 dagar)</td><td style="color:'+col+';font-weight:700">'+(pos?'+':'')+fmtKr(perDag*30)+'</td></tr>';
  h += '<tr class="highlight"><td>'+KM.dagar+' dagar (valt period)</td><td style="color:'+col+'">'+(pos?'+':'')+fmtKr(perPeriod)+'</td></tr>';
  h += '</table>';

  // Pitch box – anpassat per affärsmodell
  h += '<div style="margin-top:16px;padding:14px 16px;background:#0d352e;border-radius:12px;color:white;font-size:13px;line-height:1.8">';
  h += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;opacity:0.8;margin-bottom:8px">💬 Säljargument</div>';

  // Economic argument
  const econArg = 'Ni köper för <strong>'+fmtKrOre(totalInkopPerKopp)+'</strong> och säljer för <strong>'+fmtKr(KM.butikPris)+'</strong> – '
    + 'det ger <strong>'+margPctInkl.toFixed(1)+'%</strong> marginal och <strong>'+(pos?'+':'')+fmtKrOre(margKr)+'/kopp</strong>. '
    + 'Vid '+KM.kopparPerDag+' koppar/dag: <strong>'+fmtKr(perDag)+'/dag</strong> och <strong>'+fmtKr(perPeriod)+' på '+KM.dagar+' dagar</strong>.';

  const maskinArg = modell === 'leasing'
    ? 'Maskinen leasas för <strong>'+fmtKr(S.leasingPerMan)+'/mån</strong> – ingen stor engångsinvestering.'
    : modell === 'paslag'
    ? 'Maskinen ingår – maskinavgiften på <strong>'+S.koppprispaslag+' kr/kopp</strong> ingår redan i ert inköpspris.'
    : '<strong>Maskinen ingår utan kostnad</strong> – ni betalar bara för det ni faktiskt säljer.';

  if (modell === 'lan' || modell === 'paslag') {
    h += econArg + ' ' + maskinArg;
  } else {
    h += econArg + ' ' + maskinArg;
  }
  h += '</div>';

  // Value arguments
  h += '<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">';
  const args = [
    { icon: '🍊', title: 'En service som stannar kvar', text: 'Smootheria är inte en produkt ni ställer på en hylla och hoppas på – det är en service som är aktiv, synlig och engagerar kunderna varje dag. Det skapar rörelse och liv hos kunden.' },
    { icon: '👀', title: 'Fångar uppmärksamhet', text: 'Maskinen och de färgglada kopparna skapar nyfikenhet och drar blickar. Kunder som annars bara passerar stannar till – och den som stannar köper.' },
    { icon: '🏆', title: 'Kunden blir en destination', text: 'Har ni Smootheria erbjuder ni något de andra inte gör. Kunder väljer att handla hos er för att de vet att de kan få en fräsch smoothie – lojalitet byggd på upplevelse.' },
    { icon: '💬', title: 'Samtal och rekommendationer', text: 'En smoothie som blandas på plats är ett samtalsämne. Kunder berättar för vänner, delar på sociala medier och återkommer. Ni får gratis marknadsföring med varje kopp.' },
    { icon: '🌿', title: 'Möter kundernas livsstil', text: 'Hälsosamt, naturligt och bekvämt – tre trender som bara växer. Smootheria positionerar er kund som modern och medveten utan att ni behöver göra något aktivt.' },
    { icon: '🤝', title: 'Ingen risk, bara möjlighet', text: 'Ni investerar ingenting i utrustning. Vi tar risken, ni tar marginalen. Om det inte säljer som förväntat kan vi flytta maskinen – ni förlorar ingenting.' },
  ];
  args.forEach(a => {
    h += '<div style="display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,0.12);border-radius:8px;padding:10px 12px">';
    h += '<span style="font-size:18px;flex-shrink:0;margin-top:1px">'+a.icon+'</span>';
    h += '<div><div style="font-weight:700;font-size:13px;margin-bottom:2px">'+a.title+'</div>';
    h += '<div style="font-size:12px;opacity:0.85;line-height:1.5">'+a.text+'</div></div>';
    h += '</div>';
  });
  h += '</div></div></div>';
  el.innerHTML = h;
}


// Boot
try { render(); } catch(e) { console.warn('Init render error:', e); }

// login handled above
</script>
</body>
</html>
